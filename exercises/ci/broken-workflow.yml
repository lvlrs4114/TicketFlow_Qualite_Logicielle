# Support de diagnostic uniquement : ce fichier n'est PAS exécuté par GitHub Actions.
name: Broken example
on: [push]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dev &
      - run: npm run e2e
